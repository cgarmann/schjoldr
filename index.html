<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schjoldr — kommer snart</title>
  <meta name="description" content="Schjoldr — en nettside er under utvikling. Ta kontakt for henvendelser." />
  <meta name="robots" content="noindex" />

  <!-- Open Graph -->
  <meta property="og:title" content="Schjoldr — kommer snart" />
  <meta property="og:description" content="En ny nettside er under utvikling." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://schjoldr.io" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0a0d14;
      --text: #f4f5f7;
      --text-soft: #b2b7c2;
      --text-dim: #787e8c;
      --border: #1f2432;
      --accent: #8ab0e0;
      --accent-2: #c9b089;
      --accent-grad: linear-gradient(135deg, #8ab0e0 0%, #c9b089 100%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -30%;
      right: -20%;
      width: 80%;
      height: 100%;
      background: radial-gradient(circle, rgba(138, 176, 224, 0.14) 0%, transparent 60%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -30%;
      left: -20%;
      width: 80%;
      height: 100%;
      background: radial-gradient(circle, rgba(201, 176, 137, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .wrap {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
      z-index: 1;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 48px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
    }

    .logo-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      background: var(--accent-grad);
      border-radius: 10px;
      color: #0a0d14;
      font-weight: 900;
      font-size: 1.4rem;
      box-shadow: 0 8px 32px -8px rgba(138, 176, 224, 0.45);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 28px;
    }

    .eyebrow .dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(138, 176, 224, 0.8);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 24px;
      max-width: 800px;
    }

    .gradient {
      background: var(--accent-grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lead {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--text-soft);
      max-width: 520px;
      line-height: 1.6;
      margin-bottom: 48px;
    }

    .contact {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 26px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .contact:hover {
      border-color: var(--accent);
      background: rgba(138, 176, 224, 0.06);
      color: var(--accent);
      transform: translateY(-1px);
    }

    .contact svg {
      width: 16px;
      height: 16px;
    }

    .footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      z-index: 2;
    }

    .runic {
      letter-spacing: 0.2em;
    }

    @media (max-width: 480px) {
      .footer {
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo">
      <span class="logo-mark">S</span>
      SCHJOLDR
    </div>

    <div class="eyebrow">
      <span class="dot"></span>
      Under utvikling
    </div>

    <h1>En ny side er <span class="gradient">på vei opp</span>.</h1>

    <p class="lead">
      Vi bygger noe solid. Kom tilbake om en stund, eller ta kontakt
      direkte for henvendelser.
    </p>

    <a class="contact" href="mailto:post@schjoldr.io">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <path d="M3 7l9 6 9-6"/>
      </svg>
      post@schjoldr.io
    </a>
  </main>

  <div class="footer">
    <span>© 2026 SCHJOLDR</span>
    <span class="runic">ᛋᚲᛁᛟᛚᛞᚱ</span>
  </div>
</body>
</html>
